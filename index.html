<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" id="themecolor">
<meta name="color-scheme" content="only light" id="colorscheme">
<script>try{if(localStorage.getItem('sch-theme')==='dark'){document.documentElement.dataset.theme='dark';document.getElementById('colorscheme').content='dark'}}catch(e){}</script>
<meta name="description" content="Où skier ce week-end avec ton Magic Pass : météo au sommet, ouvertures, neige, route et hébergement en un classement.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Schussly — où skier ce week-end</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:only light;
  --paper:#FFFFFF; --card:#F5F4F1; --ink:#141414; --mute:#565C62; --line:rgba(20,20,20,.14); --ctl:#8A8F94;
  --inv:#141414; --invfg:#FFFFFF;
  --sky:#6FA3BE; --sun:#D8B65A; --sage:#9DB3A7; --cloud:#E6DFE2; --navy:#3C5A92; --dot:rgba(237,230,218,.55);
  --warn:#9A3F1E; --warnbg:#FBE3D6; --good:#1F6B40; --goodbg:#DDF0E3;
  --r:18px;
}
html[data-theme="dark"]{color-scheme:dark;--paper:#121314;--card:#1E1F21;--ink:#F2F1EE;--mute:#A9AEB3;--line:rgba(255,255,255,.14);--ctl:#7D8287;--inv:#F2F1EE;--invfg:#121314}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #141414;outline-offset:2px;box-shadow:0 0 0 5px #fff;border-radius:8px}
.num,.r b,.h b,.big,.tl time,.chip b,.score{font-variant-numeric:tabular-nums}

/* top bar */
.themebtn .moon{display:none}
html[data-theme="dark"] .themebtn .moon{display:block}
html[data-theme="dark"] .themebtn .sunic{display:none}
.top{display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 0;position:sticky;top:0;background:var(--paper);z-index:5}
.top h1{font:700 clamp(18px,5vw,21px)/1.15 Outfit,sans-serif;flex:1;min-width:0}
.logo{display:flex;align-items:center;gap:8px;font:800 21px Outfit,sans-serif;letter-spacing:-.01em;flex:1}
.logo i{width:22px;height:22px;border-radius:0 0 0 22px;background:var(--sun);display:block}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--ctl);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;text-decoration:none}
.crit{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;margin:0 0 12px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--ctl);background:var(--card);text-decoration:none;font-size:14px;cursor:pointer}
.crit span{flex:1;min-width:0;line-height:1.35}
.crit b{font-weight:600}
.crit em{font-style:normal;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* weather cards */
.wcard{position:relative;overflow:hidden;border-radius:var(--r);padding:20px;color:#141414;isolation:isolate}
.wcard.sun{background:var(--sky)} .wcard.cloud{background:var(--sage)} .wcard.snow{background:var(--navy);color:#fff}
.wcard.off{background:#DAD7D0;color:#3F4449}
.wcard::before{content:"";position:absolute;z-index:-1;pointer-events:none}
.wcard.sun::before{width:220px;height:220px;border-radius:50%;background:var(--sun);top:-110px;right:-110px}
.wcard.cloud::before{width:150px;height:150px;border-radius:50%;background:var(--cloud);top:-70px;right:-40px;box-shadow:-80px 30px 0 -20px var(--cloud),-20px 70px 0 -30px var(--cloud)}
.wcard.snow::before{width:44px;height:44px;border-radius:50%;background:var(--dot);top:14px;right:18px;box-shadow:-58px 34px 0 -8px var(--dot),-8px 66px 0 -14px var(--dot),-104px -6px 0 -12px var(--dot),30px 54px 0 -6px var(--dot)}
.wcard.compact.sun::before{width:150px;height:150px;top:-75px;right:-75px}
.wcard.compact.cloud::before{width:110px;height:110px;top:-55px;right:-30px}
.wcard.compact.snow::before{width:32px;height:32px;top:10px;right:14px}
.wcard .cond,.wcard .where{position:relative;max-width:calc(100% - 64px)}
.kicker{font-size:14px;font-weight:500}
.cond{font:700 26px/1.15 Outfit,sans-serif;margin:2px 0 0}
.cond small{font:500 14px Inter,sans-serif;margin-left:6px;white-space:nowrap}
.big{font:800 112px/0.9 Outfit,sans-serif;letter-spacing:-.04em;margin:20px 0 6px;display:flex;align-items:flex-start}
.big sup{font:700 24px Outfit,sans-serif;letter-spacing:0;margin:10px 0 0 6px}
.compact .big{font-size:68px;margin:10px 0 2px}
.compact .big sup{font-size:17px;margin-top:6px}
.where{font:700 22px/1.2 Outfit,sans-serif}
.where small{display:block;font:500 14px Inter,sans-serif;margin-top:2px}
.rows{margin-top:14px;border-top:1px solid rgba(0,0,0,.25);border-bottom:1px solid rgba(0,0,0,.25);padding:6px 0}
.snow .rows{border-color:rgba(255,255,255,.4)}
.r{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:15px}
.r svg{flex-shrink:0}
.r span{flex:1;min-width:0}
.r b{font-weight:600;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
@media (max-width:370px){.grid2{grid-template-columns:1fr}.big{font-size:92px}}
.rank{position:absolute;top:18px;right:20px;font:700 14px Outfit,sans-serif;background:rgba(255,255,255,.85);color:#141414;border-radius:999px;padding:4px 10px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.88);color:#141414}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.good{background:var(--goodbg);color:var(--good)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.strip div{background:rgba(255,255,255,.28);border-radius:10px;padding:6px 2px;text-align:center;font-size:12.5px;line-height:1.25}
.snow .strip div{background:rgba(255,255,255,.14)}
.strip b{display:block;font:700 16px Outfit,sans-serif}

/* actions */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.92);color:#141414;font-weight:600;font-size:15px;text-decoration:none;border:0;cursor:pointer;text-align:center}
.btn.dark{background:var(--inv);color:var(--invfg)}
.wcard .btn.dark{background:#141414;color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--ctl);color:var(--ink)}
.btn svg{flex-shrink:0}

/* form */
.field{margin-top:20px}
.field>label,.field>.lbl{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.input{width:100%;height:54px;border-radius:14px;border:1.5px solid var(--ctl);background:var(--card);padding:0 16px;font:500 17px Inter,sans-serif;color:var(--ink)}
.input[aria-invalid="true"]{border-color:var(--warn)}
.err{color:var(--warn);font-size:14px;font-weight:500;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-width:56px;min-height:56px;padding:6px 12px;border-radius:14px;border:1.5px solid var(--ctl);background:var(--card);cursor:pointer;text-align:center;line-height:1.2}
.chip small{display:block;font-size:12.5px;color:var(--mute)}
.chip b{font:700 19px Outfit,sans-serif}
.chip.we{border-width:2px}
.chip[aria-pressed="true"]{background:var(--inv);border-color:var(--inv);color:var(--invfg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1.5px solid var(--ctl);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;padding:4px}
.seg button small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--inv);color:var(--invfg)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.8}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg.sm button{min-height:38px;font-size:13.5px}
.cta{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;min-height:58px;margin-top:24px;border:0;border-radius:16px;background:var(--inv);color:var(--invfg);font:700 18px Outfit,sans-serif;cursor:pointer;text-decoration:none}
.cta:disabled{opacity:.6}
.sticky{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));z-index:3;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.note{font-size:13.5px;color:var(--mute);margin-top:10px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--ctl);background:var(--card);font:700 22px Outfit,sans-serif;cursor:pointer}
.stepper output{font:700 22px Outfit,sans-serif;min-width:2ch;text-align:center}

/* list */
.daytabs{position:sticky;top:60px;z-index:4;background:var(--paper);padding:0 0 10px}
.list{display:flex;flex-direction:column;gap:12px}
.sec{font:700 18px Outfit,sans-serif;margin:24px 0 10px}
.sec small{font:500 14px Inter,sans-serif;color:var(--mute);margin-left:6px}
.summary{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;font-size:15px;border:1px solid var(--line)}
.summary p{margin:8px 0 0}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.counts span{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.slim{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 12px}
.slim a.main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;min-height:52px;text-decoration:none}
.slim .score{font:800 26px Outfit,sans-serif;width:44px;text-align:center;flex-shrink:0}
.dotc{width:11px;height:11px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:5px}
.dotc.sun{background:var(--sun)} .dotc.cloud{background:var(--sage)} .dotc.snow{background:var(--navy)} .dotc.off{background:#B9B5AC}
.slim .t{flex:1;min-width:0}
.slim .t b{display:block;font-weight:600;line-height:1.25}
.slim .t>span{font-size:13.5px;color:var(--mute)}
.slim .mini{display:flex;gap:6px}
.slim .mini a{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--ctl);display:flex;align-items:center;justify-content:center;text-decoration:none}
.closedbox{background:var(--card);border-radius:var(--r);padding:4px 16px;border:1px solid var(--line);margin-top:12px}
.closedbox summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600}
.closedbox ul{margin:0 0 12px;padding:0;list-style:none;font-size:14px}
.closedbox li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.closedbox li span:last-child{color:var(--mute);text-align:right}
.closedbox li a{font-weight:500}
.banner{font-size:13.5px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;display:flex;gap:10px;align-items:center}
.banner span{flex:1}
.banner button{background:none;border:1.5px solid var(--ctl);border-radius:10px;min-height:40px;padding:0 10px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.empty{background:var(--card);border-radius:var(--r);padding:22px;text-align:center;border:1px solid var(--line)}
.empty .btn{margin-top:12px}
.cardlink{display:block;text-decoration:none;color:inherit;cursor:pointer;border-radius:12px}
.more{width:100%;margin-top:12px}
.acts.three{grid-template-columns:1.15fr 1fr 1fr}
.acts.three .btn{font-size:14px;padding:0 8px;gap:5px}
.staynote{margin:8px 0 0;font-size:13px;opacity:.85}
.rows .r.wide{grid-column:1 / -1}
.rnote{grid-column:1 / -1;margin:2px 0 0;font-size:12.5px;opacity:.8}
.r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold{background:var(--card);border:1px solid var(--line);border-radius:16px}
.fold summary{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 12px;cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold .score{font:800 26px Outfit,sans-serif;width:40px;text-align:center;flex-shrink:0}
.fold .t{flex:1;min-width:0}
.fold .t b{display:block;font-weight:600;line-height:1.25}
.fold .t>span{font-size:13.5px;color:var(--mute)}
.fold .chev{transition:transform .2s;flex-shrink:0}
.fold[open] .chev{transform:rotate(90deg)}
.foldbody{padding:0 14px 14px}
.foldsub{margin:0;font-size:14px;color:var(--mute)}
.foldbody .rows{border-color:var(--line)}
.foldbody .btn{background:var(--paper);border:1.5px solid var(--ctl)}
.foldbody .btn.dark{background:var(--inv);color:var(--invfg);border:0}
.foldbody .staynote{color:var(--mute)}
.live{margin-top:12px}
.livecam{position:relative;width:100%;aspect-ratio:16/10;border:0;border-radius:14px;background:#000;display:block;margin-top:10px}
.camph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:16/10;border-radius:14px;background:linear-gradient(160deg,#6FA3BE,#3C5A92);color:#fff;text-align:center;padding:16px;margin-top:10px}
.camph p{margin:0;font-size:14px;color:#fff;opacity:.9}
.courtesy{font-size:12px;color:var(--mute);margin-top:6px}
.pros{margin:8px 0 0;padding:0;list-style:none}
.pros li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.pros li:first-child{border-top:0}
.pros li svg{flex-shrink:0;margin-top:2px}
.cons{margin-top:10px;font-size:14px;color:var(--mute)}

/* station */
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 0;padding:0;list-style:none}
.h{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:13px;color:var(--mute)}
.h .pic{display:block;margin:4px auto 2px}
.strip .pic{display:block;margin:2px auto}
.slim .pic{flex-shrink:0}
.h b{display:block;font:700 22px Outfit,sans-serif;color:var(--ink)}
.h .w{color:var(--warn);font-weight:600}
.panel{background:var(--card);border-radius:var(--r);padding:16px;margin-top:12px;border:1px solid var(--line)}
.panel h2{font:700 18px Outfit,sans-serif;margin:0 0 4px}
.panel p{margin:0;color:var(--mute);font-size:14.5px}
.linklist a{display:flex;align-items:center;justify-content:space-between;min-height:50px;border-top:1px solid var(--line);text-decoration:none;font-weight:500}
.linklist h2+a{border-top:0}
.inl{font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.why{font-size:14.5px;margin:6px 0 0;padding:0;list-style:none}
.why li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.why li:first-child{border-top:0}
.why b{white-space:nowrap}
.ovr{margin-top:10px;background:none;border:1.5px solid var(--ctl);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink)}
.undo{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;font-weight:600;padding:4px;color:inherit;min-height:32px}

/* package */
.tl{position:relative;margin:8px 0 0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 14px 66px;min-height:36px}
.tl time{position:absolute;left:0;top:0;font:700 15px Outfit,sans-serif}
.tl li::before{content:"";position:absolute;left:52px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.tl li::after{content:"";position:absolute;left:56px;top:19px;bottom:0;width:1.5px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl .dayh{padding:6px 0 8px;font:700 15px Outfit,sans-serif;color:var(--mute);min-height:0}
.tl .dayh::first-letter{text-transform:uppercase}
.tl .dayh::before,.tl .dayh::after{display:none}
.tl b{font-weight:600}
.tl small{display:block;color:var(--mute);font-size:13.5px}
.opt{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.opt .grow{flex:1;min-width:0}
.opt .grow b{display:block}
.opt .grow span{font-size:13.5px;color:var(--mute)}
.alert{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14.5px}
.alert b{display:block}
.alert .btn{margin-top:10px;background:#fff;color:#141414}
.night{padding:12px 0;border-top:1px solid var(--line)}
.panel h2+.night{border-top:0}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center;text-decoration:none;font-size:12.5px;font-weight:600;color:var(--mute);border-radius:14px}
nav.tabs a svg{stroke:currentColor}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ctl)}
nav.tabs a[aria-current="page"] svg{stroke-width:2.4}
footer{font-size:13px;color:var(--mute);margin-top:28px;line-height:1.6}
footer a{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--inv);color:var(--invfg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.skel{height:300px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--paper),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* calendrier période */
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cal .chip{min-width:0;width:100%}
.cal .chip.mid{background:var(--card);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.calhint{font-size:13.5px;color:var(--mute);margin-top:8px}
/* budget */
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.check{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;border:1.5px solid var(--ctl);background:var(--card);font-weight:600;font-size:14.5px;cursor:pointer;padding:0 8px}
.check input{width:20px;height:20px;accent-color:var(--ink);margin:0}
.check:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.range{width:100%;height:44px;accent-color:var(--ink);margin:4px 0 0}
.rangeval{display:flex;justify-content:space-between;align-items:baseline}
.rangeval b{font:700 26px Outfit,sans-serif}
.rangeval span{font-size:13px;color:var(--mute)}
.split{margin-top:10px;font-size:14px;color:var(--mute)}
.split b{color:var(--ink)}
.bud{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.bud:first-of-type{border-top:0}
.bud.tot{font-weight:700;border-top:1.5px solid var(--ink);margin-top:4px}
.bud span small{display:block;font-size:12.5px;color:var(--mute);font-weight:400}
.bud b{font-variant-numeric:tabular-nums;white-space:nowrap}
.resto{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.resto .grow{flex:1;min-width:0}
.resto .grow b{display:block;font-size:15px}
.resto .grow span{font-size:13.5px;color:var(--mute)}
.resto .px{text-align:right;font-weight:700;white-space:nowrap;font-size:15px}
.resto .px small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.resto a{color:inherit}
.rh{font:700 15px Outfit,sans-serif;margin:14px 0 2px}
.sel{width:100%;height:54px;border-radius:14px;border:1.5px solid var(--ctl);background:var(--card);padding:0 12px;font:500 16px Inter,sans-serif;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .input{height:50px}
.switch{display:flex;align-items:center;gap:10px;font-size:15px;margin-top:12px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--ink)}
.bchip{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--goodbg);color:var(--good)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const S = window.STATIONS;
  const byId = Object.fromEntries(S.map((s, i) => [s.id, i]));
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const ses = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} } };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- dates & formats ----------
  const todayZ = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Zurich' }).format(new Date());
  const iso = (d) => d.toISOString().slice(0, 10);
  const addDays = (s, n) => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
  const diffDays = (a, b) => Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 864e5);
  const dow = (s) => new Date(s + 'T12:00:00Z').getUTCDay();
  const WD = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'], WDL = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  const MO = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const fmtDay = (s) => `${WD[dow(s)]} ${+s.slice(8)} ${MO[+s.slice(5, 7) - 1]}`;
  const fmtDayLong = (s) => `${WDL[dow(s)]} ${+s.slice(8)} ${MO[+s.slice(5, 7) - 1]}`;
  const hm = (min) => { min = Math.round(min); const h = Math.floor(min / 60), m = min % 60; return h ? (m ? `${h} h ${String(m).padStart(2, '0')}` : `${h} h`) : `${m} min`; };
  const clock = (min) => { min = ((Math.round(min) % 1440) + 1440) % 1440; return `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`; };
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const pres = (t) => /^Les /.test(t) ? 'près des ' + t.slice(4) : /^Le /.test(t) ? 'près du ' + t.slice(3) : 'près de ' + t;
  const consecutive = (ds) => ds.every((d, k) => k === 0 || diffDays(ds[k - 1], d) === 1);
  const PISTES = 8 * 60 + 45, LEAVE_SKI = 16 * 60 + 30, EVE = 18 * 60 + 30;

  // ---------- state ----------
  const overrides = store.get('sch-overrides', {});
  const saved = store.get('sch-prefs', {});
  const st = {
    origin: saved.origin || 'Lausanne', originDraft: null,
    mode: ['day', 'between', 'eve'].includes(saved.mode) ? saved.mode : 'day',
    maxDrive: saved.maxDrive || 180, travelers: saved.travelers || 2,
    days: saved.days || [], pkgChoice: saved.pkgChoice || {},
    avail: [], data: null, loading: false, error: null, geoError: null,
    activeDay: null, sort: 'score', prevRoute: null, pickEnd: false,
    budget: Object.assign({ max: 800, fuel: true, food: true, lodge: true }, saved.budget || {}),
    set: Object.assign({ car: 'yarish', cons: 6.0, mtn: true, fuel: 2.10, lunch: 28, dinner: 45, night: 100, diet: 'all' }, saved.set || {})
  };
  function persist() { store.set('sch-prefs', { origin: st.origin, mode: st.mode, maxDrive: st.maxDrive, travelers: st.travelers, days: st.days, pkgChoice: st.pkgChoice, budget: st.budget, set: st.set }); }
  // période : jours consécutifs uniquement, 7 jours max
  const MAXDAYS = 7;
  const rangeOf = (a, b) => { if (b < a) [a, b] = [b, a]; const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; };
  st.days = st.days.length ? rangeOf(st.days[0], st.days[st.days.length - 1]).slice(0, MAXDAYS) : [];

  // ---------- voiture, carburant, budget ----------
  // conso réelle relevée (Spritmonitor, Yaris 2015) ; +15 % montagne/froid
  const CARS = { yaris: { l: 'Toyota Yaris 1.33 essence (2011–2016)', c: 6.0 }, yarish: { l: 'Toyota Yaris Hybride (2012–2019)', c: 4.8 }, custom: { l: 'Autre voiture (je saisis la conso)', c: null } };
  const consNow = () => (st.set.car === 'custom' || !CARS[st.set.car] ? +st.set.cons || 6 : CARS[st.set.car].c) * (st.set.mtn ? 1.15 : 1);
  const fuelCHF = (km) => km * consNow() / 100 * (+st.set.fuel || 2.1);
  const chf = (x) => `${Math.round(x).toLocaleString('fr-CH')} CHF`;
  const RESTOS = window.RESTOS || {};
  const DIETS = [['all', 'Tout'], ['montagne', 'Cuisine de montagne'], ['gastro', 'Gastronomique'], ['vege', 'Végétarien'], ['vegan', 'Végan']];
  const GASTRO = new Set(window.RESTO_GASTRO || []), VEGE = new Set(window.RESTO_VEGE || []);
  const MOUNTAIN = /fondue|raclette|rösti|valais|savoyard|fromage|matouille|terroir|alpage|comtois|braserade|jurassienne|ardoise|agneau|régiona|jambon|ferme|cabane|refuge|buvette|gîte|tsébetta|illhorn/i;
  const tagsOf = (r) => { const t = []; if (MOUNTAIN.test(r[0] + ' ' + r[4])) t.push('montagne'); if (GASTRO.has(r[0])) t.push('gastro'); if (VEGE.has(r[0])) t.push('vege'); return t; };
  const fitsDiet = (r) => st.set.diet === 'all' || tagsOf(r).includes(st.set.diet === 'vegan' ? 'vegan' : st.set.diet);
  const restosAll = (s, t) => (RESTOS[s.id] || []).filter((r) => !t || r[1] === t);
  // les adresses qui collent à l'envie choisie passent devant
  const restosOf = (s, t) => { const L = restosAll(s, t); return [...L.filter(fitsDiet), ...L.filter((r) => !fitsDiet(r))]; };
  const mealAvg = (s, t) => { const A = restosAll(s, t), M = A.filter(fitsDiet), L = ['montagne', 'gastro'].includes(st.set.diet) && M.length ? M : A; return L.length ? L.reduce((a, r) => a + r[2], 0) / L.length : (t === 'p' ? +st.set.lunch : +st.set.dinner); };
  const budgetOn = () => st.budget.fuel || st.budget.food || st.budget.lodge;
  const rooms = () => Math.ceil(st.travelers / 2);
  // coût estimé du séjour entier dans une seule station (cartes du classement)
  function costFor(r) {
    const n = nights(), days = st.days.length || 1;
    const km = r.dist != null ? (st.mode === 'day' ? days * 2 * r.dist : 2 * r.dist) : null;
    const fuel = st.budget.fuel && km != null ? fuelCHF(km) : 0;
    const food = st.budget.food ? st.travelers * (days * mealAvg(r.s, 'p') + n * mealAvg(r.s, 'v')) : 0;
    const lodgeEst = st.budget.lodge ? n * (+st.set.night || 100) * rooms() : 0;
    const left = st.budget.max - fuel - food;
    const perNight = st.budget.lodge && n ? Math.floor(left / n) : null;
    return { km, fuel, food, lodgeEst, perNight, total: fuel + food + lodgeEst, n };
  }
  const nightMax = (perNight) => perNight != null && perNight >= 30 ? perNight : null;

  // shared plan in the URL: #/package?d=2026-11-28,2026-11-29&s=saasfee,glacier3000&m=between&o=Lausanne&p=2
  (function readShared() {
    const q = location.hash.split('?')[1]; if (!q) return;
    const p = new URLSearchParams(q);
    if (p.get('d')) st.days = p.get('d').split(',').filter((d) => /^\d{4}-\d\d-\d\d$/.test(d)).sort();
    if (['day', 'between', 'eve'].includes(p.get('m'))) st.mode = p.get('m');
    if (p.get('o')) st.origin = p.get('o');
    if (p.get('p')) st.travelers = clamp(+p.get('p') || 2, 1, 8);
    if (p.get('s')) { const id = p.get('s').split(',')[0]; st.pkgChoice = byId[id] != null ? { all: id } : {}; }
  })();

  // ---------- data ----------
  const tfetch = (url) => fetch(url, (window.AbortSignal && AbortSignal.timeout) ? { signal: AbortSignal.timeout(9000) } : {});
  class GeoError extends Error {}
  async function geocode(q) {
    const j = await (await tfetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name=' + encodeURIComponent(q))).json();
    if (!j.results || !j.results.length) throw new GeoError('Lieu introuvable');
    return { name: j.results[0].name, lat: j.results[0].latitude, lon: j.results[0].longitude };
  }
  async function weatherAll() {
    const P = S.map((s) => s.wx || [s.lat, s.lon]);
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${P.map((p) => p[0])}&longitude=${P.map((p) => p[1])}&elevation=${S.map((s) => s.elev)}&hourly=temperature_2m,sunshine_duration,wind_gusts_10m,snowfall,snow_depth&timezone=Europe%2FZurich&past_days=3&forecast_days=8`;
    const j = await (await tfetch(url)).json();
    if (!Array.isArray(j)) throw new Error(j.reason || 'Météo indisponible');
    return j.map((x) => x.hourly);
  }
  async function drives(o) {
    const coords = [`${o.lon},${o.lat}`].concat(S.map((s) => `${s.lon},${s.lat}`)).join(';');
    const j = await (await tfetch(`https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=duration,distance`)).json();
    if (j.code !== 'Ok') throw new Error('Routage indisponible');
    return { dr: j.durations[0].slice(1).map((sec) => (sec == null ? null : Math.round(sec / 60 * 1.2))), dist: j.distances[0].slice(1).map((m) => (m == null ? null : Math.round(m / 1000))) };
  }
  function hourlyDay(h, d) {
    const idx = []; h.time.forEach((t, i) => { if (t.startsWith(d)) { const H = +t.slice(11, 13); if (H >= 9 && H <= 16) idx.push(i); } });
    if (idx.length < 8) return null;
    const s0 = idx[0], sum = (a, ii) => ii.reduce((x, i) => x + (a[i] || 0), 0);
    return {
      sunMin: sum(h.sunshine_duration, idx) / 60, gust: Math.max(...idx.map((i) => h.wind_gusts_10m[i] || 0)),
      snowDay: sum(h.snowfall, idx), depth: h.snow_depth[s0] || 0,
      fresh72: sum(h.snowfall, Array.from({ length: 72 }, (_, k) => s0 - 72 + k).filter((i) => i >= 0)),
      hours: [9, 11, 13, 15].map((H) => { const i = idx[H - 9]; return { t: H, temp: h.temperature_2m[i], sun: h.sunshine_duration[i] / 60, gust: h.wind_gusts_10m[i], snow: h.snowfall[i] }; })
    };
  }
  function aggDay(a, d) {
    const x = a && a[d]; if (!x) return null;
    return { sunMin: x[0], gust: x[1], snowDay: x[2], depth: x[3], fresh72: x[4], hours: x[5].map(([t, temp, sun, gust, snow]) => ({ t: +t, temp, sun, gust, snow })) };
  }
  const wxFor = (i, d) => st.data.agg ? aggDay(st.data.agg[i], d) : (st.data.wx ? hourlyDay(st.data.wx[i], d) : null);
  function availDates() {
    const t = todayZ();
    const all = st.data.agg ? Object.keys(st.data.agg[0]) : [...new Set(st.data.wx[0].time.map((x) => x.slice(0, 10)))];
    return all.sort().filter((d) => d >= t).slice(0, 8);
  }
  const driveOf = (i) => st.data.dr ? st.data.dr[i] : null;
  const distOf = (i) => st.data.dist ? st.data.dist[i] : null;
  const roadTxt = (r) => r.drive != null ? hm(r.drive) + (r.dist != null ? ' · ' + r.dist + ' km' : '') : '–';
  // ---------- live (remontées et pistes ouvertes, relevées 2×/jour sur magicpass.ch) ----------
  const LIVE = window.LIVE || null;
  const liveTime = LIVE ? LIVE.fetchedAt.slice(11, 16) : null;
  function liveFor(s, d) {
    if (!LIVE || LIVE.date !== d) return null;
    const L = LIVE.stations[s.id];
    if (!L || (!L.liftsTotal && !L.kmTotal)) return null;
    return L;
  }
  const liveSkiOpen = (L) => L.open && ((L.kmOpen || 0) > 0 || (!L.kmTotal && L.liftsOpen > 0));
  const kmTot = (s) => { const L = LIVE && LIVE.stations[s.id]; return L && L.kmTotal ? L.kmTotal : s.km; };
  const fmtKm = (x) => (Math.round(x * 10) / 10).toLocaleString('fr-CH');
  function hav(a, b) { const R = 6371, r = Math.PI / 180, dl = (b.lat - a.lat) * r, dn = (b.lon - a.lon) * r; const x = Math.sin(dl / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }
  const transferEst = (a, b) => Math.max(15, Math.round(hav(a, b) * 1.7 / 50 * 60 / 5) * 5); // estimation, routes de montagne

  // ---------- scoring (poids sur 100) ----------
  function openState(s, d) {
    const o = overrides[s.id + '|' + d]; if (o) return o;
    const L = liveFor(s, d); if (L) return liveSkiOpen(L) ? 'open' : 'closed';
    const weekend = [0, 6].includes(dow(d));
    if (s.status === 'open' || (s.dailyFrom && d >= s.dailyFrom)) return 'open';
    if (s.condFrom && d >= s.condFrom && weekend) return 'maybe';
    if (!s.dailyFrom && !s.condFrom) return 'unknown';
    return 'closed';
  }
  function parts(s, w, drive, o, d) {
    const L = liveFor(s, d), km = L ? (L.kmOpen || 0) : kmTot(s);
    return {
      dom: o === 'open' ? 15 + 10 * Math.min(1, km / 60) : o === 'maybe' ? 8 : 5,
      sun: 20 * Math.min(1, w.sunMin / 420),
      wind: 15 * clamp((90 - w.gust) / 60, 0, 1),
      snow: 15 * Math.min(1, w.depth / 0.8) + 5 * Math.min(1, w.fresh72 / 30),
      trip: drive == null ? 10 : 20 * clamp((240 - drive) / 180, 0, 1)
    };
  }
  const rawTotal = (p) => Math.round(p.dom + p.sun + p.wind + p.snow + p.trip);
  function total(p, o, w) { let x = rawTotal(p); if (o !== 'open' && w.depth < 0.3) x = Math.min(x, 45); return x; }
  function theme(w) { if (!w) return 'off'; if (w.snowDay >= 2 || w.sunMin < 90) return 'snow'; return w.sunMin >= 300 ? 'sun' : 'cloud'; }
  function condWord(w) { if (!w) return 'Pas de prévision'; if (w.snowDay >= 2) return 'Chutes de neige'; if (w.sunMin < 90) return 'Couvert'; return w.sunMin >= 300 ? 'Grand beau' : 'Voilé'; }
  const stateTxt = { part: 'Pas ouverte tous les jours', open: 'Ouvert', maybe: 'Préouverture si neige', unknown: 'Ouverture non annoncée', closed: 'Fermé' };
  const verdict = (x, o) => o !== 'open' ? 'À confirmer' : x >= 80 ? 'Excellent' : x >= 65 ? 'Bon plan' : x >= 50 ? 'Correct' : 'Moyen';

  function evalRow(i, d) {
    const s = S[i], o = openState(s, d), w = wxFor(i, d), drive = driveOf(i), dist = distOf(i), L = liveFor(s, d);
    const p = w && o !== 'closed' ? parts(s, w, drive, o, d) : null;
    return { s, i, d, o, w, drive, dist, L, p, sc: p ? total(p, o, w) : null };
  }
  // une seule destination pour toute la période : score = moyenne des jours (jour fermé = 0)
  function periodRow(i) {
    const rows = st.days.map((d) => evalRow(i, d)), f = rows[0];
    if (rows.length === 1) return Object.assign({ rows }, f);
    const ok = rows.filter((r) => r.sc != null), W = rows.filter((r) => r.w).map((r) => r.w);
    const avg = (k) => W.reduce((a, w) => a + w[k], 0) / W.length;
    const w = W.length ? { sunMin: avg('sunMin'), gust: Math.max(...W.map((x) => x.gust)), snowDay: avg('snowDay'), depth: W[0].depth, fresh72: W[0].fresh72, hours: W[0].hours } : null;
    const o = !ok.length ? 'closed' : rows.every((r) => r.o === 'open') ? 'open' : ok.length < rows.length ? 'part' : 'maybe';
    const sc = ok.length ? Math.round(rows.reduce((a, r) => a + (r.sc || 0), 0) / rows.length) : null;
    return { s: f.s, i, d: f.d, o, w, drive: f.drive, dist: f.dist, L: f.L, p: ok.length ? ok[0].p : null, sc, rows };
  }
  const isPeriod = () => st.days.length > 1;
  function rowsFor(d) {
    const all = S.map((_, i) => d === 'P' ? periodRow(i) : evalRow(i, d));
    const inRange = all.filter((r) => r.drive == null || r.drive <= st.maxDrive);
    const key = { score: (a, b) => (b.sc ?? -1) - (a.sc ?? -1), route: (a, b) => (a.drive ?? 999) - (b.drive ?? 999), snow: (a, b) => (b.w ? b.w.depth : -1) - (a.w ? a.w.depth : -1) }[st.sort];
    const sortF = (a, b) => key(a, b) || (b.sc ?? -1) - (a.sc ?? -1) || (a.drive ?? 999) - (b.drive ?? 999);
    return {
      open: inRange.filter((r) => r.sc != null && r.o === 'open').sort(sortF),
      confirm: inRange.filter((r) => r.sc != null && r.o !== 'open').sort(sortF),
      closed: inRange.filter((r) => r.sc == null).sort((a, b) => (a.s.condFrom || a.s.dailyFrom || '9999').localeCompare(b.s.condFrom || b.s.dailyFrom || '9999')),
      far: all.filter((r) => r.drive != null && r.drive > st.maxDrive)
    };
  }
  const byScore = (a, b) => b.sc - a.sc;
  const bestOf = (d) => { const R = rowsFor(d || 'P'); return [...R.open].sort(byScore)[0] || [...R.confirm].sort(byScore)[0] || null; };

  // ---------- format du séjour ----------
  function modeOptions() {
    const n = st.days.length, ok = consecutive(st.days);
    const f = st.days[0], l = st.days[n - 1];
    return [
      { k: 'day', l: 'Journée', s: 'aller-retour', ok: true },
      { k: 'between', l: n > 1 ? `${n - 1} nuit${n > 2 ? 's' : ''}` : 'Nuits', s: n > 1 && f ? `${WD[dow(f)]} → ${WD[dow(l)]}` : 'choisis 2 jours', ok: n > 1 && ok },
      { k: 'eve', l: `${n} nuit${n > 1 ? 's' : ''}`, s: f ? `dès ${WD[dow(addDays(f, -1))]} soir` : '', ok: ok }
    ];
  }
  function fixMode(silent) {
    const o = modeOptions().find((x) => x.k === st.mode);
    if (!o || !o.ok) { st.mode = 'day'; if (!silent) toast(consecutive(st.days) ? 'Format ajusté aux jours choisis' : 'Jours non consécutifs : format Journée'); }
  }
  const nights = () => st.mode === 'day' ? 0 : st.mode === 'between' ? st.days.length - 1 : st.days.length;
  const nightBefore = (d) => ({ ci: addDays(d, -1), co: d });
  // hébergement proposé sur les cartes et la fiche : les nuits du séjour recherché
  function stayFor(d) {
    const n = st.days.length, f = st.days[0], l = st.days[n - 1];
    if (st.days.includes(d) && n > 1 && consecutive(st.days)) return { ci: st.mode === 'eve' ? addDays(f, -1) : f, co: l };
    if (st.days.includes(d) && st.mode === 'eve' && n === 1) return { ci: addDays(d, -1), co: d };
    return { ci: addDays(d, -1), co: d };
  }

  function bindSearch() {
    const inp = $('#origin');

    $$('[data-city]').forEach((b) => b.addEventListener('click', async () => { await load(b.dataset.city); st.originDraft = null; persist(); go('#/classement'); }));
    $('#days').addEventListener('click', (e) => {
      const b = e.target.closest('[data-d]'); if (!b) return; const d = b.dataset.d;
      if (st.pickEnd && st.days.length === 1 && d !== st.days[0]) {
        let r = rangeOf(st.days[0], d);
        if (r.length > MAXDAYS) { r = d > st.days[0] ? r.slice(0, MAXDAYS) : r.slice(-MAXDAYS); toast('7 jours maximum'); }
        st.days = r; st.pickEnd = false;
      } else { st.days = [d]; st.pickEnd = true; }
      fixMode(true); persist(); show({ focus: `[data-d="${d}"]`, keepScroll: true });
    });
    $('#modes').addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (!b || b.disabled) return; st.mode = b.dataset.m; persist(); show({ focus: `[data-m="${st.mode}"]`, keepScroll: true }); });
    $('#drv').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; st.maxDrive = +b.dataset.v; persist(); show({ focus: `[data-v="${st.maxDrive}"]`, keepScroll: true }); });
    $$('[data-pax]').forEach((b) => b.addEventListener('click', () => { st.travelers = clamp(st.travelers + +b.dataset.pax, 1, 8); persist(); show({ focus: `[data-pax="${b.dataset.pax}"]`, keepScroll: true }); }));
    $$('[data-bud]').forEach((c) => c.addEventListener('change', () => { st.budget[c.dataset.bud] = c.checked; persist(); show({ focus: `[data-bud="${c.dataset.bud}"]`, keepScroll: true }); }));
    const rg = $('#bud');
    rg.addEventListener('input', () => { st.budget.max = +rg.value; $('#budv').textContent = chf(st.budget.max); $('#split').innerHTML = splitPreview(); });
    rg.addEventListener('change', persist);
    $('#f').addEventListener('submit', async (e) => {
      e.preventDefault();
      st.pickEnd = false;
      const q = (st.originDraft ?? st.origin).trim() || 'Lausanne';
      if (q !== st.origin || st.geoError) { const ok = await load(q); if (!ok) return; }
      st.originDraft = null; st.activeDay = st.days[0]; go('#/classement');
    });
  }

          <div><label class="lbl" for="dinner" style="font-weight:600;font-size:14px">Soir au village</label><input class="input" id="dinner" type="number" inputmode="numeric" min="5" max="200" step="1" value="${T.dinner}"></div>

  function bindSettings() {

    $('#mtn').addEventListener('change', (e) => { st.set.mtn = e.target.checked; persist(); show({ keepScroll: true, focus: '#mtn' }); });
    num('cons', 'cons', 2, 20); num('fuel', 'fuel', 1, 4); num('lunch', 'lunch', 5, 150); num('dinner', 'dinner', 5, 200); num('night', 'night', 20, 600);

  // ---------- restaurants ----------
  function restoPanel(stations, cap) {
    const uniq = stations.filter((s, k) => stations.findIndex((x) => x.id === s.id) === k);
    const any = uniq.some((s) => restosOf(s).length);
    const TL = { montagne: 'cuisine de montagne', gastro: 'gastronomique', vege: 'option végé confirmée' };
    const item = (s, r) => { const fits = cap == null || r[2] <= cap, tg = tagsOf(r), hit = st.set.diet !== 'all' && fitsDiet(r); return `<div class="resto"><div class="grow"><b>${ext(mapsSearch(r[0], s), esc(r[0]), '')}</b><span>${esc(r[4])}</span>${tg.length ? `<br>${tg.map((t) => `<span class="bchip${hit && t === st.set.diet ? '' : ' tag'}">${TL[t]}</span>`).join(' ')}` : ''}</div><div class="px">≈ ${r[2]} CHF<small>${r[3] === 'carte' ? 'carte officielle' : 'estimation'} · /pers.</small>${cap != null ? `<span class="bchip${fits ? '' : ' over'}">${fits ? 'dans le budget' : 'au-dessus'}</span>` : ''}</div></div>`; };
    const block = (s) => {
      const P = restosOf(s, 'p'), V = restosOf(s, 'v');
      const vq = st.set.diet === 'vegan' ? 'restaurant végane' : 'restaurant végétarien';
      const veg = ['vege', 'vegan'].includes(st.set.diet) && !restosAll(s).some(fitsDiet) ? `<p style="margin-top:8px">Option ${st.set.diet === 'vegan' ? 'végane' : 'végé'} non confirmée ici&nbsp;: ${ext(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(vq + ' ' + s.town)}`, `chercher ${pres(s.town)} ${I.arrow}`, 'inl')}</p>` : '';
      return `${uniq.length > 1 ? `<h3 class="rh">${esc(s.name)}</h3>` : ''}${veg}${P.length ? `<p style="margin-top:8px"><b>Midi sur les pistes</b></p>${P.map((r) => item(s, r)).join('')}` : ''}${V.length ? `<p style="margin-top:8px"><b>Soir au village</b></p>${V.map((r) => item(s, r)).join('')}` : nights() ? `<p style="margin-top:8px">Soir&nbsp;: pas de restaurant référencé ${pres(s.town)}, compté ${chf(st.set.dinner)}/pers.</p>` : ''}`;
    };
    if (!any) return '';
    return `<section class="panel"><h2>Où manger</h2><p>Restaurants recommandés par les stations et offices du tourisme. Prix moyen d’un repas (plat + boisson) par personne${cap != null ? ` · ton budget repas ≈ ${chf(cap)} par personne` : ''}.</p>${uniq.map(block).join('')}</section>`;
  }

  function viewRank() {
    const per = isPeriod(), d = per ? 'P' : st.days[0]; st.activeDay = st.days[0];

    const title = per ? `${fmtDay(st.days[0])} → ${fmtDay(st.days[n - 1])}` : fmtDay(d);
    const best = [...R.open].sort(byScore)[0], nearest = [...R.open].sort((a, b) => (a.drive ?? 999) - (b.drive ?? 999))[0];
    const sorts = [['score', 'Meilleur score'], ['route', 'Plus proche'], ['snow', 'Plus de neige']];

      ${critBar()}

      </section>

      ${R.closed.length ? `<details class="closedbox"><summary>${R.closed.length} station${R.closed.length > 1 ? 's' : ''} fermée${R.closed.length > 1 ? 's' : ''} ${per ? 'sur toute la période' : 'ce jour'}</summary><ul>${R.closed.map((r) => `<li><a href="#/station/${r.s.id}/${r.d}">${esc(r.s.name)}</a><span>${r.L ? 'fermé à ' + liveTime + ' · ' + r.L.liftsOpen + '/' + r.L.liftsTotal + ' remontées' : openingTxt(r.s)}</span></li>`).join('')}</ul></details>` : ''}
      <a class="cta" href="#/package">Voir mon week-end ${I.chev}</a>`;
  }

  function viewStation(id, d) {

    const R = rowsFor(d), rank = R.open.findIndex((x) => x.s.id === id) + 1;
    const th = sc == null ? 'off' : theme(w);

    const leave = drive != null ? PISTES - drive - 20 : null;
    document.title = s.name + ' · Schussly';

    if (o === 'closed') {

        <article class="wcard off">

  function go(h, replace) { if (replace) { history.replaceState(null, '', h); onRoute(); } else if (location.hash === h) show(); else location.hash = h; }
  function route() { const h = location.hash.split('?')[0].replace(/^#\/?/, '').split('/'); return { name: h[0] || 'classement', a: h[1], b: h[2] }; }
  const brand = `<header class="top"><div class="logo"><i aria-hidden="true"></i>Schussly</div><button type="button" class="iconbtn themebtn" data-theme-toggle aria-label="Basculer mode clair / sombre"><svg class="sunic" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button></header>`;
  function show(opt = {}) {
    const R = route(), y = window.scrollY;
    const tab = ['recherche', 'criteres'].includes(R.name) ? 'search' : R.name === 'package' ? 'pkg' : R.name === 'reglages' ? 'set' : 'rank';
    $$('nav.tabs a').forEach((a) => a.dataset.tab === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    const v = $('#view');
    v.setAttribute('aria-busy', String(!st.data || st.loading));
    if (!st.data) {
      v.innerHTML = st.error
        ? `${brand}<div class="empty"><b>Impossible de charger les prévisions.</b><p>${esc(st.error)}</p><button type="button" class="btn dark" data-retry>Réessayer</button></div>`
        : `${brand}<div class="skel" role="status"><span class="sr">Chargement</span></div><p class="note" style="text-align:center">Analyse de ${S.length} stations…</p>`;
      const rt = $('[data-retry]'); if (rt) rt.addEventListener('click', () => load(st.origin));
      return;
    }
    if (!st.avail.length) { v.innerHTML = `${brand}<div class="empty"><b>Données de démo expirées.</b><p>Ouvre la version en ligne pour les prévisions du jour.</p></div>`; return; }
    let html = null;
    if (R.name === 'station') { const d = st.avail.includes(R.b) ? R.b : (st.activeDay || st.days[0]); html = viewStation(R.a, d); if (html) { v.innerHTML = html; bindStation(); } }
    if (html == null) {
      if (R.name === 'package') { v.innerHTML = viewPkg(); bindPkg(); }
      else if (R.name === 'recherche' || R.name === 'criteres') { document.title = 'Recherche · Schussly'; v.innerHTML = viewSearch(); bindSearch(); }
      else if (R.name === 'reglages') { document.title = 'Réglages · Schussly'; v.innerHTML = viewSettings(); bindSettings(); }
      else { document.title = 'Classement · Schussly'; v.innerHTML = viewRank(); bindRank(); }
    }
    if (opt.keepScroll) window.scrollTo(0, y);
    if (opt.focus) { const f = $(opt.focus); if (f) f.focus({ preventScroll: true }); }
  }
  let cur = location.hash || '#/classement';
  function onRoute() {
    const prev = cur; cur = location.hash || '#/classement';
    if (prev === cur) { show(); return; }
    ses.set('y:' + prev.split('?')[0], String(window.scrollY));
    st.prevRoute = prev;
    const r = route(); if (r.name === 'station' && st.days.includes(r.b)) st.activeDay = r.b;
    show();
    const restore = cur.startsWith('#/classement') && prev.startsWith('#/station');
    window.scrollTo(0, restore ? (+ses.get('y:' + cur.split('?')[0]) || 0) : 0);
    if (!restore) $('#view').focus({ preventScroll: true });
  }
  window.addEventListener('hashchange', onRoute);
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-theme-toggle]')) return;
    const dark = document.documentElement.dataset.theme !== 'dark';
    if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('sch-theme', dark ? 'dark' : 'light'); } catch (err) {}
    $('#themecolor').setAttribute('content', dark ? '#121314' : '#FFFFFF'); $('#colorscheme').setAttribute('content', dark ? 'dark' : 'only light');
    toast(dark ? 'Mode sombre' : 'Mode clair');
  });
  if (document.documentElement.dataset.theme === 'dark') $('#themecolor').setAttribute('content', '#121314');

  async function load(q) {
    st.loading = true; st.error = null; st.geoError = null; show({ keepScroll: true });
    let origin = null;
    try { origin = await geocode(q); }
    catch (e) {
      if (e instanceof GeoError) {
        st.loading = false; st.geoError = `« ${q} » introuvable. Vérifie l’orthographe (ex. Lausanne, Sion, Genève).`; st.originDraft = q;
        if (st.data) { if (route().name !== 'recherche') go('#/recherche'); else show(); } else fallback(st.origin);
        return false;
      }
    }
    if (origin) {
      try {
        const [wx, rt] = await Promise.all([weatherAll(), drives(origin).catch(() => null)]);
        st.data = { origin, wx, dr: rt && rt.dr, dist: rt && rt.dist, live: true, when: new Date().toLocaleTimeString('fr-CH', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Zurich' }) };
        st.origin = q; finish(); return true;
      } catch (e) { /* bascule sur les données figées */ }
    }
    fallback(q); return true;
  }
  // communes rattachées à la ville de départ précalculée la plus proche (version hors ligne)
  const ALIASES = Object.fromEntries([
    ['Lausanne', 'Pully Prilly Epalinges Le Mont-sur-Lausanne Crissier Ecublens Chavannes-près-Renens Lutry Paudex Belmont-sur-Lausanne Romanel Bussigny Cheseaux Jouxtens Saint-Sulpice Savigny Cugy Lausanne-gare Ouchy'],
    ['Genève', 'Carouge Lancy Meyrin Vernier Onex Thônex Chêne-Bourg Chêne-Bougeries Plan-les-Ouates Versoix Cologny Grand-Saconnex Bernex Genf Geneva'],
    ['Sion', 'Sierre Conthey Savièse Vétroz Nendaz Grimisuat'], ['Fribourg', 'Marly Villars-sur-Glâne Givisiez Granges-Paccot Freiburg'],
    ['Neuchâtel', 'Peseux Hauterive Marin Boudry La Chaux-de-Fonds Le Locle'], ['Berne', 'Bern Köniz Ostermundigen Muri Thun Thoune Bienne Biel'],
    ['Montreux', 'Clarens La Tour-de-Peilz Villeneuve'], ['Vevey', 'Corsier-sur-Vevey Corseaux Saint-Légier Blonay Chexbres'],
    ['Morges', 'Préverenges Tolochenaz Saint-Prex Echichens Aubonne Rolle'], ['Nyon', 'Gland Prangins Coppet Founex Commugny'],
    ['Yverdon-les-Bains', 'Yverdon Grandson Orbe Chavornay Echallens'], ['Martigny', 'Fully Saxon Leytron Verbier Le Châble'],
    ['Bulle', 'Gruyères Broc Châtel-Saint-Denis Romont'], ['Monthey', 'Collombey Saint-Maurice Bex'], ['Aigle', 'Ollon Leysin Villars-sur-Ollon'],
    ['Zurich', 'Zürich Winterthur Baden Zoug Zug Lucerne Luzern']
  ].flatMap(([city, list]) => list.split(' ').map((c) => [c.replace(/-/g, ' ').trim(), city]).concat(list.includes('-') ? list.split(' ').map((c) => [c, city]) : [])));
  function fallback(q) {
    const snap = window.SNAPSHOT;
    if (!snap) { st.error = 'Vérifie ta connexion puis réessaie.'; st.loading = false; show(); return; }
    const norm = (t) => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const routes = snap.routes || { [snap.origin.name]: { lat: snap.origin.lat, lon: snap.origin.lon, drive: snap.drive, dist: snap.dist } };
    const nq = norm(q);
    let key = Object.keys(routes).find((k) => nq.includes(norm(k)) || (nq.length >= 3 && norm(k).startsWith(nq)));
    if (!key) { const a = Object.entries(ALIASES).find(([k]) => nq.includes(norm(k))); if (a && routes[a[1]]) key = a[1]; }
    const rt = key ? routes[key] : null;
    st.data = { origin: rt ? { name: key, lat: rt.lat, lon: rt.lon } : { name: q, query: q, lat: null, lon: null }, agg: snap.days, dr: rt ? rt.drive : null, dist: rt ? rt.dist : null, live: false, when: snap.generatedAt, cities: Object.keys(routes) };
    st.origin = q; finish();
  }
  function finish() {
    st.avail = availDates();
    st.days = st.days.filter((d) => st.avail.includes(d));
    if (st.days.length) st.days = rangeOf(st.days[0], st.days[st.days.length - 1]).filter((d) => st.avail.includes(d)).slice(0, MAXDAYS);
    if (!st.days.length && st.avail.length) {
      const sat = st.avail.find((d) => dow(d) === 6);
      st.days = sat ? [sat, addDays(sat, 1)].filter((d) => st.avail.includes(d)) : [st.avail[0]];
    }
    if (!st.pkgChoice.all) st.pkgChoice = {};
    fixMode(true); persist();
    st.loading = false; show();
  }
  if (!location.hash) history.replaceState(null, '', '#/classement');
  show(); load(st.origin);
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.host)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
})();
</script>
